name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Building release for $VERSION"

      - name: Check if release already exists
        id: check_release
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $VERSION already exists, skipping..."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release $VERSION does not exist, proceeding..."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"

          cat > release_notes.md << NOTES_EOF
          ## Direct browser review write-back

          This release removes the copy-and-download step from browser review completion:

          - Flow, UI, PRD Outline, and Outline Discovery reviews can write their final decisions directly from the browser.
          - Write-back is mechanical persistence only; model reasoning and regeneration happen when the relevant Codex command is run again.
          - Target-version checks, stable request IDs, idempotent replay, cross-process locking, and atomic replacement protect review artifacts.
          - Bounded retries cover transient file and network failures across macOS, Linux, and Windows.
          - Stale pages, target conflicts, and invalid requests fail closed instead of offering an unsafe fallback package.
          - Fallback downloads appear only for explicitly recoverable transport failures.
          - Follow-up Flow, UI, and PRD runs use \`revision_requests.target_ref\` to limit regeneration to reviewed targets and directly affected neighbors.
          - Automated and browser checks cover all four write-back routes, conflicts, retries, fallback policy, and concurrent launchers.
          - Existing projects must refresh their installed templates after upgrading the CLI.

          ## Install

          \`\`\`bash
          uv tool install specify-cli --from git+https://github.com/flyfoxai/SpecCompass.git@${VERSION}
          specify init my-project --integration codex
          \`\`\`

          NOTES_EOF

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          VERSION_NO_V=${VERSION#v}
          gh release create "$VERSION" \
            --title "SpecCompass - $VERSION_NO_V" \
            --notes-file release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
