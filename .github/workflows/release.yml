name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Building release for $VERSION"

      - name: Check if release already exists
        id: check_release
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $VERSION already exists, skipping..."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release $VERSION does not exist, proceeding..."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"

          cat > release_notes.md << NOTES_EOF
          ## Accurate and adjustable UI review previews

          This release turns \`/sp.ui\` review into a more faithful design-mechanism preview without turning the browser into a direct UI editor:

          - UI review pages render declared buttons, copy, inputs, tables, cards, badges, states, and layout regions accurately while intentionally keeping visual polish lightweight.
          - A strongly bounded inline preview supports the normal review workflow, while a read-only full-preview dialog makes ordinary desktop web layouts inspectable without shrinking the entire review surface.
          - Selecting any declared component opens element-specific natural-language feedback plus controls for replacement text, position, width, and height, with separate desktop, tablet, and mobile geometry.
          - Selecting the preview title bar opens screen-level layout feedback, such as changing three columns to two, without permanently occupying the right rail; selecting a component replaces it with that component's controls.
          - Every adjustment remains a provisional review request and is written back as identity-validated structured evidence. Browser interactions never directly mutate the authoritative UI source.
          - Existing projects must refresh their installed templates after upgrading the CLI: \`specify init . --integration <agent> --force\`.

          ## Install

          \`\`\`bash
          uv tool install specify-cli --from git+https://github.com/flyfoxai/SpecCompass.git@${VERSION}
          specify init my-project --integration codex
          \`\`\`

          NOTES_EOF

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          VERSION_NO_V=${VERSION#v}
          gh release create "$VERSION" \
            --title "SpecCompass - $VERSION_NO_V" \
            --notes-file release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
