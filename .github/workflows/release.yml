name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Building release for $VERSION"

      - name: Check if release already exists
        id: check_release
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $VERSION already exists, skipping..."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release $VERSION does not exist, proceeding..."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"

          cat > release_notes.md << NOTES_EOF
          ## Regenerate rejected Outline drafts

          This patch adds a safe way to reject an unconfirmed pre-baseline Outline and generate a new one from the real requirement sources:

          - \`/sp.prd <root> --discard-outline-draft\` creates a digest-bound plan before moving any draft-owned artifact.
          - The reset archives only the rejected Outline, its review/discovery records, and unactivated boundary proposals into auditable history.
          - Every PRD, spec, Flow, UI, plan, task, implementation file, test, data file, and migration remains in place.
          - \`outline-draft-reset.json\` binds the immutable plan, preserved PRD digests, archived files, and transitional review index before regeneration can start.
          - \`/sp.prd <root> --regenerate-outline-draft --reset <reset-id>\` uses model capability to generate a genuinely new Outline rather than restoring or renaming the rejected draft.
          - Candidate projects use temporary \`draft-project-*\` identities; stable project codes are considered only after human confirmation and separate reconciliation.
          - Fixed paths, canonical digests, short leases, idempotent recovery, locale-independent ordering, and symlink/hard-link rejection keep the reset fail closed across supported systems.
          - The ordinary aligned PRD, Flow, and UI work remains unchanged when no reset receipt exists.
          - Existing projects must refresh their installed templates after upgrading the CLI: \`specify init . --integration <agent> --force\`.

          ## Install

          \`\`\`bash
          uv tool install specify-cli --from git+https://github.com/flyfoxai/SpecCompass.git@${VERSION}
          specify init my-project --integration codex
          \`\`\`

          NOTES_EOF

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          VERSION_NO_V=${VERSION#v}
          gh release create "$VERSION" \
            --title "SpecCompass - $VERSION_NO_V" \
            --notes-file release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
