name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Building release for $VERSION"

      - name: Check if release already exists
        id: check_release
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $VERSION already exists, skipping..."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release $VERSION does not exist, proceeding..."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"

          cat > release_notes.md << NOTES_EOF
          ## Regenerate PRD, Flow, and UI outputs directly

          This patch makes a direct stage command regenerate its own active output instead of replacing the requested work with project-boundary adoption:

          - Ordinary \`/sp.prd <feature>\` preserves \`prd.md\` and regenerates the complete Outline and its review artifacts from current requirement facts.
          - Ordinary \`/sp.flow <feature>\` and \`/sp.ui <feature>\` regenerate their complete active Flow or UI output from current upstream facts.
          - When confirmed or recorded human input exists, the command asks whether to preserve those records as non-authoritative fresh-review input or clear all active generated output and start clean.
          - Missing legacy \`000\`/\`001\` boundary registration is a non-blocking advisory; approved structural transitions and damaged established authority still fail closed before deletion.
          - A fully confirmed writeback returns \`--consume-review-confirmation\` and advances readiness without regeneration; revision or open-item results return to the ordinary full-regeneration path.
          - Digest-bound inventories, interruption recovery, path confinement, tampered-plan detection, bounded Windows retries, and symlink/hard-link rejection keep resets safe across supported systems.
          - PRDs, stable specs, other command output, plans, tasks, code, tests, data, and migrations remain outside the command reset scope.
          - Existing projects must refresh their installed templates after upgrading the CLI: \`specify init . --integration <agent> --force\`.

          ## Install

          \`\`\`bash
          uv tool install specify-cli --from git+https://github.com/flyfoxai/SpecCompass.git@${VERSION}
          specify init my-project --integration codex
          \`\`\`

          NOTES_EOF

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          VERSION_NO_V=${VERSION#v}
          gh release create "$VERSION" \
            --title "SpecCompass - $VERSION_NO_V" \
            --notes-file release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
