name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Building release for $VERSION"

      - name: Check if release already exists
        id: check_release
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $VERSION already exists, skipping..."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release $VERSION does not exist, proceeding..."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"

          cat > release_notes.md << NOTES_EOF
          ## Source-backed layered Outline planning

          This release makes each SP design stage consume the right evidence at the right level:

          - \`/sp.prd\` builds Outline from the repository's default \`prd/\` source root, the current feature PRD, accepted decisions, and any user-supplied source directories.
          - A \`000-*\` Portfolio root defines only its direct implementation children, their responsibility boundaries, global constraints, and Subproject Handoffs. It no longer expands child-internal modules, Flow, or UI.
          - Each \`001+\` child treats its parent handoff as a direction and responsibility contract, then rereads PRD sources to generate its own detailed Outline.
          - Parent-child reconciliation checks scope, ownership, outcomes, handoffs, and inherited constraints instead of requiring both levels to repeat the same nodes.
          - \`/sp.flow\` consumes PRD plus a confirmed Outline; \`/sp.ui\` consumes PRD plus confirmed Outline and Flow. Stale or unconfirmed upstream evidence remains fail-closed.
          - Discovery validation allows one direct child project to own multiple source-backed capability atoms and business chains while preserving complete coverage and unique ownership.
          - Major business or design decisions remain human-confirmed through the owning Outline, Flow, or UI review page; downstream planning and implementation stay autonomous within those confirmed contracts.
          - Existing projects must refresh their installed templates after upgrading the CLI: \`specify init . --integration <agent> --force\`.

          ## Install

          \`\`\`bash
          uv tool install specify-cli --from git+https://github.com/flyfoxai/SpecCompass.git@${VERSION}
          specify init my-project --integration codex
          \`\`\`

          NOTES_EOF

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          VERSION_NO_V=${VERSION#v}
          gh release create "$VERSION" \
            --title "SpecCompass - $VERSION_NO_V" \
            --notes-file release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
