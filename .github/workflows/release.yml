name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Building release for $VERSION"

      - name: Check if release already exists
        id: check_release
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $VERSION already exists, skipping..."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release $VERSION does not exist, proceeding..."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"

          cat > release_notes.md << NOTES_EOF
          ## Evidence-driven recursive Outline boundaries

          This release makes recursive project decomposition follow business complexity instead of a fixed node count or a one-atom-per-project rule:

          - \`/sp.prd\` rereads the repository's default \`prd/\` source root, the current feature PRD, accepted decisions, parent handoffs, and any user-supplied source directories for every child window.
          - Capability atoms prove source coverage and unique ownership; their count does not determine how many child projects must be generated.
          - The model compares candidate partitions by coherent business responsibility, complexity reduction, stable handoffs, coordination cost, duplicated state, and acceptance fragmentation.
          - Independently owned state, outcome, role, rule set, or named handoff is a split signal, not an automatic boundary. Keeping related capabilities together is valid when it produces the lower-complexity single-responsibility unit.
          - A reasoned \`ai-proposed\` grouping can enter Discovery when PRD sources provide business facts without prescribing project architecture. An \`unresolved\` grouping cannot masquerade as a chosen child boundary.
          - There is no fixed child count, preferred range, or requirement to split as finely as possible. \`000-*\` still generates one direct layer per root window, while deeper windows remain bounded presentation slices of the recursive tree.
          - Schema, CLI, and browser validation remain strict about complete coverage, unique ownership, business-chain consistency, topology, and explicit grouping/decomposition/terminal evidence.
          - Material scope, ownership, safety, money, compliance, irreversible, critical-acceptance, or broad-rework decisions remain human-confirmed through the owning Web Discovery page.
          - Existing projects must refresh their installed templates after upgrading the CLI: \`specify init . --integration <agent> --force\`.

          ## Install

          \`\`\`bash
          uv tool install specify-cli --from git+https://github.com/flyfoxai/SpecCompass.git@${VERSION}
          specify init my-project --integration codex
          \`\`\`

          NOTES_EOF

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          VERSION_NO_V=${VERSION#v}
          gh release create "$VERSION" \
            --title "SpecCompass - $VERSION_NO_V" \
            --notes-file release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
