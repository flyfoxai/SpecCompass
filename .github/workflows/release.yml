name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Building release for $VERSION"

      - name: Check if release already exists
        id: check_release
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $VERSION already exists, skipping..."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release $VERSION does not exist, proceeding..."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"

          cat > release_notes.md << NOTES_EOF
          ## Legacy flat hierarchy adoption

          This patch fixes the remaining v0.11.31 validation conflict for existing projects migrated from a flat review index:

          - Schema-v1 migration intentionally records unknown hierarchy as \`parent_feature: null\` and \`sibling_order: 0\` without inventing lineage.
          - \`/sp.prd <root> --adopt-outline-boundaries\` now recognizes that placeholder for non-root candidates marked \`parent_unconfirmed\`.
          - The model can confirm the real parent from current handoff and Outline evidence and assign the required positive child sibling order.
          - Existing explicit parent and sibling-order facts remain immutable; adoption cannot be used as an unreviewed restructuring path.
          - Missing markers, missing parents, zero child order, duplicate sibling slots, and attempted rewrites continue to fail closed.
          - The fix changes only adoption validation and guidance; ordinary aligned PRD, Flow, and UI work remains unchanged.
          - Existing projects must refresh their installed templates after upgrading the CLI: \`specify init . --integration <agent> --force\`.

          ## Install

          \`\`\`bash
          uv tool install specify-cli --from git+https://github.com/flyfoxai/SpecCompass.git@${VERSION}
          specify init my-project --integration codex
          \`\`\`

          NOTES_EOF

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          VERSION_NO_V=${VERSION#v}
          gh release create "$VERSION" \
            --title "SpecCompass - $VERSION_NO_V" \
            --notes-file release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
