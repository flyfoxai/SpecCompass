name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Building release for $VERSION"

      - name: Check if release already exists
        id: check_release
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $VERSION already exists, skipping..."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release $VERSION does not exist, proceeding..."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"

          cat > release_notes.md << NOTES_EOF
          ## Private LAN review access and reliable Outline maps

          This patch adds an explicit private-network review mode and repairs the Outline Discovery topology contract at its source:

          - The review launcher still defaults to \`127.0.0.1\`, but \`--host <RFC1918-private-ip>\` can expose a review to another device on the same private network.
          - Public IPs, hostnames, \`0.0.0.0\`, mismatched Host headers, and unrelated project files remain blocked; LAN mode prints a clear exposure warning.
          - Outline overview maps now display the real feature code such as \`000\`, Level 1 candidates use \`01..N\`, and facts inside a candidate use \`01.1..\`.
          - A \`map_link\` is only a cross-map entry: it cannot also own same-map details, and every business child map must contain source-backed facts.
          - CLI and browser validators enforce the same feature identity, maturity, Markdown section, topology, and source-integrity rules.
          - The deterministic repair tool migrates legacy Level 1 data while preserving stable IDs, questions, and constraints; it is idempotent and restores the original file if validation fails.
          - Existing projects must refresh their installed templates after upgrading the CLI: \`specify init . --integration <agent> --force\`.

          ## Install

          \`\`\`bash
          uv tool install specify-cli --from git+https://github.com/flyfoxai/SpecCompass.git@${VERSION}
          specify init my-project --integration codex
          \`\`\`

          NOTES_EOF

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          VERSION_NO_V=${VERSION#v}
          gh release create "$VERSION" \
            --title "SpecCompass - $VERSION_NO_V" \
            --notes-file release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
