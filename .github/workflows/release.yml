name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Building release for $VERSION"

      - name: Check if release already exists
        id: check_release
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $VERSION already exists, skipping..."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release $VERSION does not exist, proceeding..."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"

          cat > release_notes.md << NOTES_EOF
          ## Source-authoritative Outline evidence

          This release closes the generation and validation gap that could make an under-explored Outline decomposition look source-complete:

          - \`/sp.prd\` rebuilds capability evidence from original business sources, accepted user decisions, and confirmed parent handoffs before considering earlier generated candidates.
          - A feature PRD is treated as a mixed-authority synthesis. Its \`[src:ai-proposed]\` boundaries, owners, states, lifecycles, and grouping reasons remain proposals on reruns; citing the whole file cannot promote them to \`doc\` authority.
          - Every source inventory entry marked \`used\` must provide structured \`evidence_refs\` to the exact source-backed capability, owner, lifecycle, state, object, operation, outcome, atom, chain, or constraint, with a reverse citation to that file. A read file that supplies no business fact is \`reviewed_no_capability\`.
          - Capability coverage now preserves source authority and explains why each result can be accepted independently, so broad wrapper capabilities cannot hide omitted states, writers, or outcomes.
          - A child that groups multiple capability atoms must cite at least one source-backed coupling invariant that crosses the proposed split. Generic claims that separation is expensive are not enough.
          - Stable-handoff evidence identifies the source atom, destination atom, exact business fact, authority, and source citation. The validator rejects self-links and handoffs that do not cross two different sibling partitions.
          - Outline Discovery schema v6 carries these contracts. Versions 3 through 5 remain readable for existing reviews but cannot be generated as current evidence.
          - CLI and browser validators enforce the same evidence authority, reverse links, coupling invariants, atomic handoff direction, and exact partition coverage.
          - Existing projects must refresh their installed templates after upgrading the CLI: \`specify init . --integration <agent> --force\`.

          ## Install

          \`\`\`bash
          uv tool install specify-cli --from git+https://github.com/flyfoxai/SpecCompass.git@${VERSION}
          specify init my-project --integration codex
          \`\`\`

          NOTES_EOF

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          VERSION_NO_V=${VERSION#v}
          gh release create "$VERSION" \
            --title "SpecCompass - $VERSION_NO_V" \
            --notes-file release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
