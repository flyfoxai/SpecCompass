name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Building release for $VERSION"

      - name: Check if release already exists
        id: check_release
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $VERSION already exists, skipping..."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release $VERSION does not exist, proceeding..."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"

          cat > release_notes.md << NOTES_EOF
          ## Explicit review acceptance and Portfolio-root boundaries

          This release makes review closeout explicit and keeps the Portfolio root separate from implementation features:

          - After inspecting an Outline, Flow, or UI review, \`/sp.accept <outline|flow|ui> <feature> [--advance]\` adopts the exact current recommendations, records an auditable formal confirmation, and advances only after the owner stage passes readiness checks.
          - Missing recommendations, unresolved \`needs-decision\` exits, stale review identity, and dedicated Outline boundary decisions remain fail-closed.
          - The explicit \`000-*\` Portfolio root owns PRD, Outline, global constraints, and handoffs only. It cannot create or consume Spec, Flow, UI, Bundle, Plan, Tasks, analysis, gate, or implementation artifacts.
          - Flow/UI review flags and the shared boundary gate enforce that root rule; implementation work starts from an explicit \`001+\` child boundary.
          - Existing projects must refresh their installed templates after upgrading the CLI: \`specify init . --integration <agent> --force\`.

          ## Install

          \`\`\`bash
          uv tool install specify-cli --from git+https://github.com/flyfoxai/SpecCompass.git@${VERSION}
          specify init my-project --integration codex
          \`\`\`

          NOTES_EOF

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          VERSION_NO_V=${VERSION#v}
          gh release create "$VERSION" \
            --title "SpecCompass - $VERSION_NO_V" \
            --notes-file release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
