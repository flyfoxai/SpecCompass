name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Building release for $VERSION"

      - name: Check if release already exists
        id: check_release
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $VERSION already exists, skipping..."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release $VERSION does not exist, proceeding..."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"

          cat > release_notes.md << NOTES_EOF
          ## Existing-project adoption without fake pages

          This patch closes the v0.11.30 setup loop for existing projects that do not yet have an authoritative Outline boundary baseline:

          - The boundary gate now routes missing baselines to one explicit \`/sp.prd <root> --adopt-outline-boundaries\` workflow instead of returning to bootstrap forever.
          - The model reads the real PRD, Outline, project directories, handoffs, and candidate report to generate a genuine proposal and Outline review page.
          - Only the user's bound loopback decision can establish authority; copied, downloaded, or model-authored decision JSON remains invalid.
          - Activation rechecks live paths, Outline mappings, handoffs, artifact digests, writer evidence, and the one-time receipt before exclusively creating the first \`ALIGNED\` baseline.
          - Concurrent calls and failures after the commit point recover forward without duplicating the receipt, baseline, code ledger, derived index, or activation log.
          - Adoption records the current project shape only. It does not move, rename, delete, invent, or rewrite existing PRD, Outline, Flow, UI, or code artifacts.
          - Flow and UI setup blocks route to the same PRD adoption page; normal aligned SP work keeps the existing lightweight path.
          - Existing projects must refresh their installed templates after upgrading the CLI: \`specify init . --integration <agent> --force\`.

          ## Install

          \`\`\`bash
          uv tool install specify-cli --from git+https://github.com/flyfoxai/SpecCompass.git@${VERSION}
          specify init my-project --integration codex
          \`\`\`

          NOTES_EOF

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          VERSION_NO_V=${VERSION#v}
          gh release create "$VERSION" \
            --title "SpecCompass - $VERSION_NO_V" \
            --notes-file release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
