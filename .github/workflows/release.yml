name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Building release for $VERSION"

      - name: Check if release already exists
        id: check_release
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $VERSION already exists, skipping..."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release $VERSION does not exist, proceeding..."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"

          cat > release_notes.md << NOTES_EOF
          ## Outline-aligned project boundaries

          This release keeps the product Outline, project boundaries, and implemented modules aligned without adding migration overhead to normal SP work:

          - Root \`000\`, child project codes, parentage, handoffs, and retired identities are recorded in one authoritative boundary baseline and monotonic feature-code ledger.
          - Models can propose project splits, merges, or reparenting while normal development remains \`ALIGNED\`; only explicit human confirmation starts structural migration.
          - Confirmed structural changes use immutable proposals, one-time decision receipts, current artifact inventory, staged publication, validation, and compare-and-swap activation.
          - Flow and UI checks run only when the transition inventory contains those artifacts; unaffected accepted decisions remain intact.
          - Direct browser write-back remains mechanical persistence only. Codex applies reviewer feedback when the owning PRD, Flow, or UI command runs again.
          - Fixed recovery claims, complete owner fencing, heartbeat-safe updates, bounded partial-write reads, and Windows deletion retries protect concurrent recovery.
          - Ordinary \`ALIGNED\` commands use the lightweight shared boundary gate and do not create proposals, receipts, transition logs, or long-lived locks.
          - Review navigation places analysis categories directly on the page and removes obsolete load controls.
          - Existing projects must refresh their installed templates after upgrading the CLI.

          ## Install

          \`\`\`bash
          uv tool install specify-cli --from git+https://github.com/flyfoxai/SpecCompass.git@${VERSION}
          specify init my-project --integration codex
          \`\`\`

          NOTES_EOF

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          VERSION_NO_V=${VERSION#v}
          gh release create "$VERSION" \
            --title "SpecCompass - $VERSION_NO_V" \
            --notes-file release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
